<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test quick filter table</title>
    <!-- Load stylesheets and library -->
    <!-- <link href="http://localhost:8085/quick-filter-table.css" rel="stylesheet" />
    <script src="http://localhost:8085/quick-filter-table.js"></script> -->
    <link
        href="https://cdn.jsdelivr.net/gh/mshafer1/quick-filter-table@1.1.0/quick-filter-table/dist/quick-filter-table.css"
        rel="stylesheet" />
    <script
        src="https://cdn.jsdelivr.net/gh/mshafer1/quick-filter-table@1.1.0/quick-filter-table/dist/quick-filter-table.js"></script>
    <script>
        function init() {
            QuickFilterTable.renderApp("app1", {
                items: [
                    { name: "Frank", age: 33, city: "Boston" },
                    { name: "Bob", age: 25, city: "Los Angeles" },
                    { name: "Laura", age: 24, city: "Philadelphia" },
                    { name: "Mallory", age: 32, city: "Dallas" },
                    { name: "Niaj", age: 23, city: "Houston" },
                    { name: "Olivia", age: 28, city: "San Diego" },
                    { name: "David", age: 28, city: "Miami" },
                    { name: "Judy", age: 26, city: "Portland" },
                    { name: "Hannah", age: 29, city: "Austin" },
                    { name: "Alice", age: 30, city: "New York" },
                    { name: "Charlie", age: 35, city: "Chicago" },
                    { name: "Eve", age: 22, city: "Seattle" },
                    { name: "Kevin", age: 34, city: "Atlanta" },
                    { name: "Ian", age: 31, city: "Denver" },
                    { name: "Grace", age: 27, city: "San Francisco" },
                ],
                headers: [
                    { text: "Name", value: "name", filter: "distinct" },
                    { text: "Age", value: "age", filter: "numberRange" },
                    { text: "City", value: "city", filter: "text" },
                ],
            });
        }

        window.addEventListener("DOMContentLoaded", init);
    </script>
</head>

<body>
    <div id="app1"></div>

</body>

</html>
